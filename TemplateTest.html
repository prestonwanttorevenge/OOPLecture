    <script>
        const quizData = [
            // ================= KHỞI ĐỘNG (1-10) =================
            {
                q: "Lập trình tổng quát (Generic Programming) là phương pháp lập trình độc lập với yếu tố nào sau đây?",
                options: ["Chi tiết biểu diễn dữ liệu (Kiểu dữ liệu).", "Hệ điều hành máy tính.", "Trình biên dịch C++.", "Cấu trúc vòng lặp."],
                correct: 0,
                explanation: "Lập trình tổng quát cho phép ta viết code mà không cần quan tâm trước dữ liệu là int, float hay kiểu gì khác. Tư tưởng là định nghĩa logic độc lập với biểu diễn dữ liệu[cite: 139].",
            },
            {
                q: "Khác biệt cơ bản giữa Đa hình (Polymorphism) thông thường và Lập trình tổng quát là gì?",
                options: ["Lập trình tổng quát chạy chậm hơn đa hình.", "Đa hình dùng cây thừa kế (Inheritance), còn lập trình tổng quát mở rộng trừu tượng hóa ra ngoài địa hạt của cây thừa kế.", "Đa hình dùng template, lập trình tổng quát dùng class.", "Không có sự khác biệt."],
                correct: 1,
                explanation: "Đa hình phụ thuộc vào cấu trúc cha-con (cây thừa kế). Lập trình tổng quát vượt ra khỏi giới hạn đó, áp dụng cho bất kỳ kiểu dữ liệu nào không cần có họ hàng với nhau[cite: 143].",
            },
            {
                q: "Trong ngôn ngữ C cổ điển, người ta thường dùng công cụ gì để mô phỏng lập trình tổng quát?",
                options: ["Từ khóa virtual.", "Trình tiền xử lý (Preprocessor) với #define.", "Con trỏ hàm.", "Thư viện stdio.h."],
                correct: 1,
                explanation: "C không có template, nên các cụ ngày xưa dùng lệnh `#define TYPE int` để trình tiền xử lý thay thế văn bản trước khi dịch[cite: 144].",
            },
            {
                q: "Hạn chế lớn nhất của việc dùng `#define TYPE int` trong C là gì?",
                options: ["Chạy rất chậm.", "Chỉ cho phép đúng một định nghĩa (một kiểu dữ liệu) trong một chương trình, và rất dễ sinh lỗi.", "Làm cháy RAM.", "Không biên dịch được."],
                correct: 1,
                explanation: "Nếu đã #define TYPE là int, thì cả chương trình đó chỉ xài được int. Muốn dùng thêm float thì chịu chết. Hơn nữa nó chỉ thay văn bản mù quáng nên rất dễ lỗi[cite: 144].",
            },
            {
                q: "Trong C++, từ khóa nào được dùng để báo cho trình biên dịch biết đoạn mã theo sau thao tác trên kiểu dữ liệu chưa xác định?",
                options: ["generic", "auto", "template", "virtual"],
                correct: 2,
                explanation: "Từ khóa `template` mở đầu cho một khuôn mẫu, theo sau là cặp ngoặc nhọn `< >` chứa tên kiểu dữ liệu tùy ý[cite: 145].",
            },
            {
                q: "Một lệnh `template <typename T>` có phạm vi hiệu lực (tác dụng) đến đâu?",
                options: ["Toàn bộ file code.", "Chỉ đối với khai báo ngay sát phía sau nó.", "Bên trong hàm main.", "Chỉ trong vòng lặp."],
                correct: 1,
                explanation: "Cực kỳ lưu ý: Một lệnh template chỉ có hiệu quả đối với khối khai báo (hàm hoặc lớp) nằm ngay sát bên dưới nó[cite: 145].",
            },
            {
                q: "Hệ thống C++ chia Khuôn mẫu (Template) thành 2 loại cơ bản nào?",
                options: ["Khuôn mẫu hàm và Khuôn mẫu con trỏ.", "Khuôn mẫu lớp và Khuôn mẫu biến.", "Khuôn mẫu hàm (Function template) và Khuôn mẫu lớp (Class template).", "Khuôn mẫu tĩnh và Khuôn mẫu động."],
                correct: 2,
                explanation: "Hai loại cơ bản là Function template (tạo hàm tổng quát) và Class template (tạo lớp tổng quát)[cite: 146].",
            },
            {
                q: "Với lệnh `template <typename T, typename U>`, điều gì là đúng?",
                options: ["Chỉ được truyền vào số nguyên.", "Khai báo tạo tham chiếu đến hai kiểu dữ liệu T và U, hai kiểu này có thể giống hoặc khác nhau.", "T bắt buộc phải khác U.", "Lỗi cú pháp."],
                correct: 1,
                explanation: "Khai báo này cho phép hàm/lớp nhận vào 2 kiểu dữ liệu tùy ý (ví dụ một cái int, một cái float)[cite: 145, 153].",
            },
            {
                q: "Về mặt bản chất, khi ta viết một Khuôn mẫu hàm (Function Template), ta đang tạo ra cái gì?",
                options: ["Một hàm duy nhất chạy được mọi kiểu.", "Một tập vô hạn các hàm chồng nhau (Overloaded functions) được sinh ra tự động.", "Một biến toàn cục.", "Một macro tiền xử lý."],
                correct: 1,
                explanation: "Template không phải là 1 hàm thực sự. Nó là bản thiết kế để compiler tự động đẻ ra vô số các hàm chồng nhau (overload) tương ứng với từng kiểu dữ liệu truyền vào[cite: 148].",
            },
            {
                q: "Thay thế kiểu `T` trong Template được thực hiện bởi ai?",
                options: ["Hệ điều hành.", "Lập trình viên.", "Trình tiền xử lý (Preprocessor).", "Trình biên dịch (Compiler)."],
                correct: 3,
                explanation: "Việc thay thế T thành int hay float không phải là thay text đơn giản, mà được thực hiện cực kỳ thông minh bởi Trình biên dịch (Compiler) lúc compile code[cite: 148].",
            },

            // ================= TĂNG TỐC (11-20) CƠ CHẾ DƯỚI GẦM MÁY =================
            {
                q: "Khi ta gọi hàm `swap(x, y)` với x,y là kiểu int. Trình biên dịch sẽ làm gì ĐẦU TIÊN?",
                options: ["Báo lỗi ngay lập tức.", "Tìm xem có một hàm swap() thông thường nào (không dùng template) lấy 2 tham số int hay không.", "Sinh ra mã máy ngay.", "Xóa biến x và y."],
                correct: 1,
                explanation: "Trình biên dịch luôn ưu tiên hàng thật (hàm viết tay thông thường) trước. Nếu không tìm thấy hàm thường, nó mới bắt đầu ngó tới bản vẽ template[cite: 149].",
            },
            {
                q: "Nếu không tìm thấy hàm thường, mà thấy một Template khớp lệnh, trình biên dịch làm gì tiếp theo?",
                options: ["Kiểm tra xem đã có một phiên bản swap() cho int được sinh ra từ template trước đó chưa.", "Báo cảnh báo.", "Bỏ qua lệnh gọi.", "Yêu cầu người dùng nhập kiểu dữ liệu."],
                correct: 0,
                explanation: "Để tránh tạo rác, nó sẽ tìm trong kho xem trước đó đã lỡ 'đẻ' ra cái hàm int nào từ template này chưa. Nếu có rồi thì dùng lại (liên kết/bind), chưa có thì mới sinh mới[cite: 150].",
            },
            {
                q: "Việc Trình biên dịch sinh ra một cài đặt hàm thực sự từ bản vẽ Template diễn ra vào lúc nào?",
                options: ["Lúc chương trình đang chạy (Runtime).", "Lúc biên dịch mã nguồn (Compile-time).", "Lúc cài đặt hệ điều hành.", "Lúc tải file lên mạng."],
                correct: 1,
                explanation: "Quá trình này gọi là Khởi tạo khuôn mẫu (Instantiation) và diễn ra hoàn toàn trong lúc biên dịch (Compile-time)[cite: 151].",
            },
            {
                q: "Hệ quả về chi phí KHÔNG GIAN (Space Overhead) khi dùng Template là gì?",
                options: ["Tiết kiệm ổ cứng tuyệt đối.", "Code bloat (Phình to file chạy) do mỗi kiểu dữ liệu gọi template sẽ sinh ra một bản sao hàm độc lập.", "RAM bị cháy.", "Giảm dung lượng file exe."],
                correct: 1,
                explanation: "Gọi template cho 10 kiểu khác nhau thì compiler đẻ ra 10 cái hàm khác nhau nhét vào file chạy, khiến dung lượng file phình to (Code bloat)[cite: 151].",
            },
            {
                q: "Tốc độ thực thi (chạy) của một hàm được sinh ra từ Template so với hàm viết tay thủ công là như thế nào?",
                options: ["Chạy chậm hơn rất nhiều do phải suy luận kiểu.", "Tốc độ chạy không khác biệt (bằng nhau) so với tự viết tay.", "Chạy nhanh gấp đôi.", "Chạy lúc được lúc không."],
                correct: 1,
                explanation: "Vì compiler đã 'đẻ' sẵn hàm tường minh ra từ lúc dịch rồi, nên lúc chạy (Runtime) máy tính cứ thế mà phi, không mất 1 mili-giây nào để suy nghĩ. Tốc độ ngang ngửa viết tay (Zero-cost)[cite: 151].",
            },
            {
                q: "Cú pháp để gọi ÉP BUỘC tường minh hàm `swap` sinh ra phiên bản `float` là gì?",
                options: ["swap(float a, float b);", "swap<float>(a, b);", "swap.float(a, b);", "<float>swap(a, b);"],
                correct: 1,
                explanation: "Mặc dù C++ có thể tự suy luận, nhưng ta có thể ép nó gọi đúng phiên bản bằng cặp `< >` sau tên hàm: `swap<float>(a, b)`[cite: 151].",
            },
            {
                q: "Khuôn mẫu lớp (Class template) có thể được áp dụng cho các từ khóa cấu trúc nào trong C++?",
                options: ["Chỉ class.", "class và struct.", "class, struct và union.", "Chỉ union."],
                correct: 2,
                explanation: "Cơ chế này hoàn toàn dùng được cho cả class, struct và union[cite: 152].",
            },
            {
                q: "Khác biệt cực kỳ cốt lõi khi khởi tạo Class Template so với Function Template là gì?",
                options: ["Class template chạy chậm hơn.", "Đối với Class Template, kiểu dữ liệu bắt buộc phải được cung cấp tường minh trong cặp < >.", "Class template không cần từ khóa template.", "Class template tự suy luận được kiểu."],
                correct: 1,
                explanation: "Hàm thì tự đoán kiểu (truyền số 1 nó tự biết là int). Nhưng Class thì không! Ngài BẮT BUỘC phải gõ `<int>` khi tạo object từ Class template[cite: 154].",
            },
            {
                q: "Tại sao Class Template bắt buộc phải khai báo kiểu tường minh (VD: `Pair<int, float> q;`)?",
                options: ["Để làm màu.", "Vì việc khởi tạo đối tượng cần cấp phát bộ nhớ. Nếu không biết kiểu, trình biên dịch không thể biết cần bao nhiêu RAM.", "Vì C++ quy định thế không có lý do.", "Để chống virus."],
                correct: 1,
                explanation: "Class là một cái thùng. Compiler phải biết ngài định nhét int (4 bytes) hay double (8 bytes) vào để nó còn đo ni đóng giày cắt bộ nhớ RAM cho chuẩn[cite: 154].",
            },
            {
                q: "Câu lệnh khai báo `Pair p;` đối với một Class Template `Pair` sẽ dẫn đến kết quả gì?",
                options: ["Tạo thành công đối tượng.", "Lỗi biên dịch (Not permitted) vì thiếu kiểu dữ liệu trong cặp < >.", "Tạo đối tượng kiểu int mặc định.", "Chạy bình thường."],
                correct: 1,
                explanation: "Lỗi ngay lập tức. Khởi tạo đối tượng từ Class Template không bao giờ được thiếu cặp ngoặc nhọn `< >` chỉ định kiểu[cite: 154].",
            },

            // ================= VƯỢT CHƯỚNG NGẠI VẬT (21-30) CLASS TEMPLATE =================
            {
                q: "Nếu ta khai báo `Pair<int, float> r;`, trong bộ nhớ máy tính có tồn tại một class tên là `Pair` không?",
                options: ["Có, class Pair tồn tại chung.", "Không có class Pair, chỉ có các class độc lập có tên là Pair<int, float> được sinh ra.", "Có class Pair nhưng bị ẩn.", "Lỗi hệ thống."],
                correct: 1,
                explanation: "Template chỉ là bản thiết kế. Trong file chạy cuối cùng không hề có class nào tên là `Pair`, mà chỉ có `Pair<int, float>` được nặn ra từ bản thiết kế đó[cite: 155].",
            },
            {
                q: "Đối với khuôn mẫu lớp, trình biên dịch sẽ sinh ra điều gì?",
                options: ["Chỉ sinh ra khai báo class.", "Chỉ sinh ra biến.", "Sinh ra cả cấu trúc class và các định nghĩa phương thức cần thiết khớp với kiểu.", "Không sinh gì cả."],
                correct: 2,
                explanation: "Nó đẻ ra toàn bộ: từ cái vỏ class đến ruột gan phèo phổi (các hàm/phương thức) bên trong, đổi hết T thành kiểu tương ứng[cite: 155].",
            },
            {
                q: "Sau khi khởi tạo `Pair<int, int> q;`, ta truy cập thành viên như thế nào?",
                options: ["q<int>.first = 5;", "q.first = 5; (Tương tác như class thông thường)", "q->first = 5;", "Pair::first = 5;"],
                correct: 1,
                explanation: "Một khi cái khuôn đã đúc ra thành phẩm, ngài cứ lấy thành phẩm đó xài như một biến/object bình thường bằng dấu chấm `.`[cite: 156].",
            },
            {
                q: "Quy trình chuẩn mực nhất (Best practice) khi thiết kế một Class Template là gì?",
                options: ["Nhắm mắt gõ chữ template ngay từ đầu.", "Tạo một class thông thường (VD: cho int) chạy test ngon lành trước, sau đó mới chuyển thành template.", "Copy code trên mạng.", "Không cần test."],
                correct: 1,
                explanation: "Kinh nghiệm xương máu: Hãy viết class chạy cứng với int trước. Chạy được, hết lỗi logic thì mới đắp chữ `template <typename T>` vào để tổng quát hóa[cite: 157].",
            },
            {
                q: "Khi đưa một phương thức (hàm) của Class Template ra ĐỊNH NGHĨA BÊN NGOÀI khối class, điều gì là BẮT BUỘC ở dòng trên cùng?",
                options: ["Từ khóa static.", "Một lệnh `template <typename T>` đặt trước mỗi phương thức.", "Từ khóa virtual.", "Không cần gì cả."],
                correct: 1,
                explanation: "Mỗi một phương thức viết ngoài class đều phải được 'cộp mác' bằng lệnh `template <typename T>` ngay trên đầu nó[cite: 161].",
            },
            {
                q: "Cú pháp đúng để định nghĩa phương thức `push` bên ngoài cho `Stack<T>` là gì?",
                options: ["void Stack::push(T i)", "template <typename T> void Stack::push(T i)", "template <typename T> void Stack<T>::push(const T& i)", "void Stack<T>::push(T i)"],
                correct: 2,
                explanation: "Bắt buộc phải có `template` phía trước, và đặc biệt TÊN LỚP ở toán tử phạm vi phải có `<T>` (nghĩa là `Stack<T>::` chứ không phải `Stack::`)[cite: 161].",
            },
            {

        ];

        let score = 0;

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('quiz-container');
            const scoreText = document.getElementById('score-text');
            const progressBar = document.getElementById('progress-bar');
            let answeredCount = 0;

            quizData.forEach((qObj, index) => {
                const qBlock = document.createElement('div');
                qBlock.className = "pb-8 border-b border-zinc-100 last:border-0";

                const qTitle = document.createElement('h3');
                qTitle.className = "font-semibold text-zinc-900 mb-4 text-base md:text-lg leading-relaxed flex";
                qTitle.innerHTML = `<span class="bg-academic-red text-white px-2.5 py-1 rounded-md text-sm mr-3 shadow-sm h-fit mt-0.5">Q${index + 1}</span> <span>${qObj.q}</span>`;
                qBlock.appendChild(qTitle);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = "flex flex-col gap-2.5";
                
                const answerDiv = document.createElement('div');
                answerDiv.className = "answer-block mt-4";
                answerDiv.innerHTML = `
                    <h4 class="font-bold text-academic-red mb-2 text-sm uppercase tracking-wide flex items-center"><i class="fa-solid fa-microchip mr-2"></i> Trinh sát báo cáo (Giải thích):</h4>
                    <p class="text-zinc-700">${qObj.explanation}</p>
                `;

                let isAnswered = false;

                qObj.options.forEach((optText, optIndex) => {
                    const btn = document.createElement('button');
                    btn.className = "option-btn px-4 py-3 rounded-lg border border-zinc-200 text-zinc-700 bg-white hover:bg-zinc-50 hover:border-red-300 focus:outline-none text-sm md:text-base";
                    
                    const charLabel = String.fromCharCode(65 + optIndex);
                    btn.innerHTML = `<span class="font-bold w-6 inline-block text-zinc-400">${charLabel}.</span> ${optText}`;

                    btn.addEventListener('click', () => {
                        if (isAnswered) return;
                        isAnswered = true;
                        answeredCount++;

                        const allBtns = optionsGrid.querySelectorAll('button');
                        allBtns.forEach((b, i) => {
                            b.classList.add('disabled');
                            b.classList.remove('hover:bg-zinc-50', 'hover:border-red-300');
                            
                            if (i === qObj.correct) {
                                b.classList.add('show-correct');
                                b.innerHTML += `<i class="fa-solid fa-check-circle float-right mt-0.5 text-emerald-600 text-lg"></i>`;
                            } 
                            else if (i === optIndex && i !== qObj.correct) {
                                b.classList.add('selected-wrong');
                                b.innerHTML += `<i class="fa-solid fa-times-circle float-right mt-0.5 text-red-600 text-lg"></i>`;
                            }
                        });

                        if (optIndex === qObj.correct) {
                            score++;
                            scoreText.innerText = score;
                            scoreText.classList.add('scale-150', 'inline-block', 'text-emerald-600');
                            setTimeout(() => scoreText.classList.remove('scale-150', 'text-emerald-600'), 300);
                        }

                        // Cập nhật thanh tiến trình
                        progressBar.style.width = `${(answeredCount / quizData.length) * 100}%`;

                        answerDiv.classList.add('show');
                    });

                    optionsGrid.appendChild(btn);
                });

                qBlock.appendChild(optionsGrid);
                qBlock.appendChild(answerDiv);
                container.appendChild(qBlock);
            });
        });
    </script>
